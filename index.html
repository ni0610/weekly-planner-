<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Schedule</title><style>
:root{color-scheme:light;--green:#e7efea;--ink:#303b35}*{box-sizing:border-box}body{margin:0;padding:12px;font:15px system-ui,sans-serif;color:var(--ink);background:#fff}header{background:var(--green);border-radius:12px;padding:20px;color:#477dc0;font-weight:600;margin-bottom:24px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 26px}section{min-width:0}h2{font:normal 19px Georgia,serif;text-align:center;letter-spacing:.5px;background:var(--green);border-radius:12px;padding:23px 6px;margin:0 0 13px}ul{list-style:none;padding:0;margin:0}li{display:flex;align-items:flex-start;gap:9px;margin:9px 2px;overflow-wrap:anywhere}li label{display:flex;gap:9px;align-items:flex-start;cursor:pointer}input[type=checkbox]{appearance:none;width:18px;height:18px;flex-shrink:0;border:1px solid #87968b;border-radius:3px;margin:2px 0;cursor:pointer}input[type=checkbox]:focus-visible{outline:2px solid #477dc0}form{display:flex;gap:5px;align-items:center;margin-top:9px}input[type=text]{width:100%;min-width:0;border:0;border-bottom:1px solid transparent;padding:7px 2px;font:inherit;background:transparent;color:inherit}input[type=text]:focus{outline:none;border-color:#a4b9a9}input::placeholder{color:#9a9f9b}button{background:none;border:0;color:#789382;font-size:22px;cursor:pointer;padding:0 5px}button:focus-visible{outline:2px solid #477dc0}footer{display:flex;align-items:center;gap:12px;margin-top:22px;color:#8c948e;font-size:12px}footer button{font:inherit;text-decoration:underline}#notice{color:#a45b38;font-size:12px} @media(max-width:560px){main{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}h2{font-size:16px;padding:17px 3px}}@media(max-width:300px){main{grid-template-columns:1fr}}body.single header,body.single footer .hint{display:none}body.single main{grid-template-columns:1fr}body.single h2{display:none}body.single{padding:4px}body.single footer{margin-top:8px}
#palette-toggle{margin-left:auto;font:inherit;text-decoration:none}#palette{border:1px solid #dce4df;border-radius:12px;padding:14px;margin:12px 0;color:var(--ink);background:#fff}#palette[hidden]{display:none}#palette-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}#palette label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}input[type=color]{width:35px;height:28px;padding:0;border:0;background:none;cursor:pointer}#palette button{font:inherit;font-size:12px;margin-top:12px}body.single #palette-toggle{display:none}
</style></head><body><header>✧・ﾟ* Weekly Schedule *・ﾟ✧</header><main id="schedule"></main><footer><span class="hint">♡ One task at a time</span><button id="undo" hidden>↶ Undo</button><span id="notice" role="status"></span><button id="palette-toggle" aria-expanded="false" aria-controls="palette">🎨 Colors</button></footer><aside id="palette" hidden><div id="palette-grid"></div><button id="reset-colors">↶ Reset colors</button></aside><script>
const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Weekend'];const key='pastel-weekly-tasks-v1';const params=new URLSearchParams(location.search);const single=days.find(d=>d.toLowerCase()===params.get('day')?.toLowerCase());if(single)document.body.classList.add('single');let tasks=Object.fromEntries(days.map(d=>[d,[]]));let last=null;const notice=document.getElementById('notice');function load(){try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved)for(const d of days)if(Array.isArray(saved[d]))tasks[d]=saved[d].filter(t=>typeof t==='string');}catch(e){notice.textContent='Không thể đọc dữ liệu đã lưu.';}}function save(){try{localStorage.setItem(key,JSON.stringify(tasks));}catch(e){notice.textContent='Trình duyệt không cho lưu dữ liệu; công việc có thể mất khi tải lại.';}}load();const main=document.getElementById('schedule');const lists={};function render(d){const ul=lists[d];if(!ul)return;ul.replaceChildren();tasks[d].forEach((t,i)=>{const li=document.createElement('li'),label=document.createElement('label'),cb=document.createElement('input'),span=document.createElement('span');cb.type='checkbox';span.textContent=t;cb.addEventListener('change',()=>{last={d,t,i};tasks[d].splice(i,1);save();render(d);document.getElementById('undo').hidden=false;});label.append(cb,span);li.append(label);ul.append(li);});}for(const d of single?[single]:days){const section=document.createElement('section'),h=document.createElement('h2'),ul=document.createElement('ul'),form=document.createElement('form'),input=document.createElement('input'),button=document.createElement('button');h.textContent='✦ '+d+' ✦';input.type='text';input.placeholder='Add a task...';input.setAttribute('aria-label','New task for '+d);input.maxLength=500;button.type='submit';button.textContent='+';button.setAttribute('aria-label','Add task');form.append(input,button);form.addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t)return;tasks[d].push(t);save();render(d);input.value='';input.focus();});section.append(h,ul,form);main.append(section);lists[d]=ul;render(d);}document.getElementById('undo').onclick=()=>{if(!last)return;tasks[last.d].splice(last.i,0,last.t);save();render(last.d);last=null;document.getElementById('undo').hidden=true;};window.addEventListener('storage',e=>{if(e.key===key){tasks=Object.fromEntries(days.map(d=>[d,[]]));load();for(const d of days)render(d);}});

const colorKey='pastel-weekly-colors-v1', defaults=Object.fromEntries(['Weekly Schedule',...days].map(d=>[d,'#e7efea']));let colors={...defaults};function loadColors(){try{const saved=JSON.parse(localStorage.getItem(colorKey)||'{}');colors={...defaults};for(const d of Object.keys(defaults))if(/^#[0-9a-f]{6}$/i.test(saved[d]||''))colors[d]=saved[d];}catch(e){}}const headings=Object.fromEntries([...main.querySelectorAll('h2')].map(h=>[h.textContent.slice(2,-2),h]));const colorInputs={};function applyColors(){document.querySelector('header').style.background=colors['Weekly Schedule'];for(const d of days)if(headings[d])headings[d].style.background=colors[d];for(const d of Object.keys(colorInputs))colorInputs[d].value=colors[d];}function saveColors(){try{localStorage.setItem(colorKey,JSON.stringify(colors));}catch(e){notice.textContent='Không thể lưu màu trong trình duyệt này.';}}loadColors();for(const d of Object.keys(defaults)){const label=document.createElement('label'),input=document.createElement('input');label.append(document.createTextNode(d));input.type='color';input.setAttribute('aria-label','Color for '+d);input.addEventListener('input',()=>{colors[d]=input.value;applyColors();saveColors();});label.append(input);document.getElementById('palette-grid').append(label);colorInputs[d]=input;}applyColors();const toggle=document.getElementById('palette-toggle'),palette=document.getElementById('palette');toggle.onclick=()=>{palette.hidden=!palette.hidden;toggle.setAttribute('aria-expanded',String(!palette.hidden));};document.getElementById('reset-colors').onclick=()=>{colors={...defaults};applyColors();saveColors();};window.addEventListener('storage',e=>{if(e.key===colorKey){loadColors();applyColors();}});
</script></body></html>
